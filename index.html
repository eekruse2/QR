<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            font-family: 'Quicksand', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(-45deg, #FF78C4, #7B6CF6, #50E3C2, #FFD93D);
            background-size: 400% 400%;
            animation: rainbow-bg 15s ease infinite;
            min-height: 100vh;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.1),
                0 0 20px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: "✨";
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }
        h1 {
            font-family: 'Pacifico', cursive;
            color: #7B6CF6;
            text-align: center;
            font-size: 3em;
            margin-bottom: 1em;
            text-shadow: 3px 3px 0px rgba(123, 108, 246, 0.2);
            animation: float 4s ease-in-out infinite;
        }
        .input-group {
            margin-bottom: 25px;
            position: relative;
            transition: all 0.3s ease;
        }
        .input-group:hover {
            transform: translateX(10px);
        }
        .input-group.primary {
            background: rgba(123, 108, 246, 0.1);
            padding: 25px;
            border-radius: 15px;
            border: 3px solid rgba(123, 108, 246, 0.3);
            box-shadow: 0 8px 20px rgba(123, 108, 246, 0.15);
            transform: scale(1.02);
        }
        .input-group.primary:hover {
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 10px 25px rgba(123, 108, 246, 0.2);
        }
        .secondary-group {
            margin-top: 40px;
            padding: 20px;
            background: rgba(80, 227, 194, 0.05);
            border-radius: 15px;
            border: 2px dashed rgba(80, 227, 194, 0.3);
        }
        .collapsible-header {
            color: #50E3C2;
            font-size: 1em;
            margin-bottom: 0;
            opacity: 0.8;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .collapsible-header:hover {
            background: rgba(80, 227, 194, 0.1);
        }
        .arrow {
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }
        .arrow.rotated {
            transform: rotate(180deg);
        }
        .collapsible-content {
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        .input-group.secondary {
            opacity: 0.7;
            transform: scale(0.98);
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.5);
            padding: 15px;
            border-radius: 10px;
        }
        .input-group.secondary:hover {
            opacity: 0.9;
            transform: translateX(10px) scale(0.99);
            background: rgba(255, 255, 255, 0.7);
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #FF78C4;
            font-weight: 600;
            font-size: 1.1em;
            letter-spacing: 0.5px;
        }
        .input-group.primary label {
            font-size: 1.2em;
            color: #7B6CF6;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #7B6CF6;
            border-radius: 15px;
            box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
        }
        .input-group.primary textarea {
            font-size: 1.1em;
            border-width: 3px;
        }
        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #50E3C2;
            border-radius: 15px;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }
        input[type="file"]:hover {
            border-color: #FF78C4;
            background: rgba(255, 120, 196, 0.1);
            transform: scale(1.01);
        }
        button {
            background: linear-gradient(-45deg, #FF78C4, #7B6CF6);
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 1.2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(123, 108, 246, 0.3);
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: "🎨";
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(123, 108, 246, 0.4);
            padding-left: 50px;
        }
        button:hover::before {
            left: 15px;
            opacity: 1;
        }
        #qrcode {
            text-align: center;
            margin-top: 30px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }
        #qrcode::before {
            content: "✨";
            position: absolute;
            top: -10px;
            left: -10px;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }
        #qrcode::after {
            content: "✨";
            position: absolute;
            bottom: -10px;
            right: -10px;
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }
        #qrcode:hover {
            transform: rotate(2deg) scale(1.02);
        }
        #qrcode img {
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        #qrcode img:hover {
            transform: scale(1.05);
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .nav a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .nav a.active {
            background: rgba(123, 108, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html" class="active">Generate QR</a>
        <a href="current-gen.html">Current Gen</a>
    </div>
    <div class="container">
        <h1>QR Code Generator</h1>
        <div class="input-group primary">
            <label for="text">Enter your URL:</label>
            <textarea id="text" rows="4" placeholder="Enter the URL you want to convert to a QR code"></textarea>
        </div>
        <div class="secondary-group">
            <h2 class="collapsible-header">
                Alternative Options
                <span class="arrow">↓</span>
            </h2>
            <div class="collapsible-content" style="display: none;">
                <div class="input-group secondary">
                    <label for="altText">Enter Plain Text:</label>
                    <textarea id="altText" rows="2" placeholder="Enter any text to convert to a QR code"></textarea>
                </div>
                <div class="input-group secondary">
                    <label for="file">Upload an Icon (under 1 MB):</label>
                    <input type="file" id="file" accept="image/*" />
                </div>
            </div>
        </div>
        <button onclick="generateQR()">Generate QR Code</button>
        <div id="qrcode"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('.collapsible-header');
            const content = document.querySelector('.collapsible-content');
            const arrow = document.querySelector('.arrow');
            
            header.addEventListener('click', function() {
                const isHidden = content.style.display === 'none';
                content.style.display = isHidden ? 'block' : 'none';
                arrow.classList.toggle('rotated');
                
                // Smooth animation for height
                if (isHidden) {
                    const height = content.scrollHeight;
                    content.style.maxHeight = height + 'px';
                } else {
                    content.style.maxHeight = '0';
                }
            });
        });

        async function generateQR() {
            const urlText = document.getElementById('text').value;
            const altText = document.getElementById('altText').value;
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];
            
            if (!urlText && !altText && !file) {
                alert('Please enter a URL, text, or upload a file');
                return;
            }

            let contentToEncode = urlText || altText;

            if (file) {
                try {
                    contentToEncode = await processFile(file);
                } catch (error) {
                    console.error('Error processing file:', error);
                    alert(error.message || 'Error processing file');
                    return;
                }
            }

            console.log('Generating QR code...');
            const qrcodeContainer = document.getElementById('qrcode');
            qrcodeContainer.innerHTML = ''; // Clear previous QR code

            try {
                // Check if the content is too large
                const maxSize = 2953; // Maximum characters for QR code with error correction level L
                if (contentToEncode.length > maxSize) {
                    throw new Error('Content is too large for a QR code. Please use a smaller file or shorter text.');
                }

                // Clear any existing QR code by removing all children
                while (qrcodeContainer.firstChild) {
                    qrcodeContainer.removeChild(qrcodeContainer.firstChild);
                }

                // Create new QR code
                new QRCode(qrcodeContainer, {
                    text: contentToEncode,
                    width: 256,
                    height: 256,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.L // Using L level for larger data capacity
                });

                // Store the QR code in localStorage
                setTimeout(() => {
                    const qrImage = qrcodeContainer.querySelector('img');
                    if (qrImage) {
                        const storedCodes = JSON.parse(localStorage.getItem('qrCodes') || '[]');
                        storedCodes.unshift({
                            dataUrl: qrImage.src,
                            content: contentToEncode,
                            date: new Date().toISOString()
                        });
                        // Keep only the last 20 codes
                        if (storedCodes.length > 20) {
                            storedCodes.pop();
                        }
                        localStorage.setItem('qrCodes', JSON.stringify(storedCodes));
                        
                        // Redirect to current-gen page after successful generation
                        window.location.href = 'current-gen.html';
                    }
                }, 100); // Small delay to ensure QR code is generated

                console.log('QR code generated successfully');
            } catch (error) {
                console.error('Error generating QR code:', error);
                alert(error.message || 'Error generating QR code');
            }
        }

        async function processFile(file) {
            if (file.type.startsWith('image/')) {
                return await processImage(file);
            } else if (file.type === 'application/pdf') {
                return await processPDF(file);
            } else {
                throw new Error('Unsupported file type. Please upload an image or PDF.');
            }
        }

        function processImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();

                reader.onload = function(e) {
                    img.src = e.target.result;
                };

                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    // Calculate new dimensions while maintaining aspect ratio
                    const maxDimension = 100; // Max width/height for the image
                    if (width > height) {
                        if (width > maxDimension) {
                            height = Math.round(height * maxDimension / width);
                            width = maxDimension;
                        }
                    } else {
                        if (height > maxDimension) {
                            width = Math.round(width * maxDimension / height);
                            height = maxDimension;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;

                    // Draw and compress image
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert to compressed JPEG
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5); // 50% quality
                    
                    // Check final size
                    const base64Length = dataUrl.length - ('data:image/jpeg;base64,'.length);
                    const finalSize = Math.ceil((base64Length * 3) / 4);
                    
                    if (finalSize > 2953) {
                        reject(new Error('Image is still too large after compression. Try a smaller image or use a URL instead.'));
                        return;
                    }
                    
                    resolve(dataUrl);
                };

                img.onerror = () => reject(new Error('Error loading image'));
                reader.onerror = () => reject(new Error('Error reading file'));
                
                reader.readAsDataURL(file);
            });
        }

        async function processPDF(file) {
            const data = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data }).promise;
            
            // Get the first page only
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.0 });
            
            // Create canvas for rendering
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Set dimensions to a smaller size while maintaining aspect ratio
            const maxDimension = 100;
            let scale = maxDimension / Math.max(viewport.width, viewport.height);
            
            canvas.width = viewport.width * scale;
            canvas.height = viewport.height * scale;
            
            // Render PDF page to canvas
            await page.render({
                canvasContext: ctx,
                viewport: page.getViewport({ scale })
            }).promise;
            
            // Convert to compressed JPEG
            const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
            
            // Check final size
            const base64Length = dataUrl.length - ('data:image/jpeg;base64,'.length);
            const finalSize = Math.ceil((base64Length * 3) / 4);
            
            if (finalSize > 2953) {
                throw new Error('PDF page is too large even after compression. Try using a URL instead.');
            }
            
            return dataUrl;
        }
    </script>
</body>
</html>
