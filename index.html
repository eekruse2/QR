<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="glow">QR Code Generator</h1>
            <p class="subtitle">Transform your content into futuristic QR codes</p>
        </header>
        
        <main>
            <div class="input-section">
                <div class="input-group">
                    <label for="url-input">URL</label>
                    <input type="url" id="url-input" placeholder="https://example.com" class="futuristic-input url-input">
                </div>
                <div class="input-group">
                    <label for="text-input">Text</label>
                    <textarea id="text-input" placeholder="Enter text here..." class="futuristic-input text-input"></textarea>
                </div>
                <div class="controls">
                    <button id="generate-btn" class="futuristic-button">Generate QR Code</button>
                    <button id="download-btn" class="futuristic-button" disabled>Download QR Code</button>
                </div>
            </div>
            
            <div class="qr-section">
                <div id="qr-code" class="qr-container"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
